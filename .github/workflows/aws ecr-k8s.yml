name: Build and Push Docker image to ECR

on:
  push:
    branches:
      - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: latest
  IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build & Push Docker Image to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          set -e
          echo "🔨 Building Docker image..."
          docker build -t $IMAGE_URI:$IMAGE_TAG -t $IMAGE_URI:${{ github.sha }} .

      - name: Push Docker image to ECR
        run: |
          set -e
          echo "📤 Pushing Docker image to ECR..."
          docker push $IMAGE_URI:$IMAGE_TAG
          docker push $IMAGE_URI:${{ github.sha }}

      - name: Image pushed successfully
        run: echo "✅ Docker image pushed to ECR as [$IMAGE_TAG] and [${{ github.sha }}]"
